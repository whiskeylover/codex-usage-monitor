
name: Publish Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          [xml]$project = Get-Content .\codex-usage-monitor.csproj
          $projectVersion = [string]$project.Project.PropertyGroup.Version

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version tag: $env:RELEASE_TAG"
          }

          if ($version -ne $projectVersion) {
            throw "Tag $version does not match project version $projectVersion"
          }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = .\installer\Install-Compiler.ps1 -ToolsDirectory (Join-Path $env:RUNNER_TEMP 'inno-tools')
          "INNO_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test update checks and card layout
        shell: pwsh
        run: |
          dotnet run --project tests/UpdateChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Update checks failed.' }
          dotnet run --project tests/LayoutChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Layout checks failed.' }

      - name: Build ZIP and Inno Setup installer
        shell: pwsh
        run: |
          .\release.ps1 -IsccPath $env:INNO_ISCC

      - name: Smoke test installer and uninstaller
        shell: pwsh
        run: .\tests\InstallerChecks.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          gh release create $env:RELEASE_TAG `
            ".\release\codex-usage-monitor-v$version-win-x64.zip" `
            ".\release\codex-usage-monitor-v$version-win-x64-setup.exe" `
            .\release\SHA256SUMS.txt `
            --verify-tag `
            --title "Codex Usage Monitor $env:RELEASE_TAG" `
            --generate-notes
